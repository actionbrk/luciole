name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LUCIOLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luciole-release.jks"
            echo "LUCIOLE_KEYSTORE_PATH=$RUNNER_TEMP/luciole-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore configured: the APK is signed with a temporary debug key, so it cannot be installed over a previous build without uninstalling it first."
          fi

      - name: Build release APK
        env:
          LUCIOLE_KEYSTORE_PASSWORD: ${{ secrets.LUCIOLE_KEYSTORE_PASSWORD }}
          LUCIOLE_KEY_ALIAS: ${{ secrets.LUCIOLE_KEY_ALIAS }}
          LUCIOLE_KEY_PASSWORD: ${{ secrets.LUCIOLE_KEY_PASSWORD }}
        run: ./gradlew :watchface:assembleRelease

      - name: Rename APK
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          cp watchface/build/outputs/apk/release/*.apk "dist/luciole-$version.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: luciole-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: luciole-apk
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "luciole $GITHUB_REF_NAME" \
            --generate-notes
